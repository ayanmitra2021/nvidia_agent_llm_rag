worker_processes auto;
pid /etc/nginx/.nginx.pid;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 0;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
		ssl_prefer_server_ciphers on;

	access_log off;
	error_log /var/log/error.log;

	gzip on;
	gzip_disable "msie6";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

	## Sticky sessions per https://github.com/gradio-app/gradio/pull/7935
	upstream gradio-app {
		ip_hash;
		server frontend_rproxy:8091;
	}

	# ## Sticky sessions per https://github.com/gradio-app/gradio/pull/7935
	# upstream gradio-chat {
	# 	ip_hash;
	# 	server chatbot_rproxy:8998;
	# }

	upstream gradio-pass {
		ip_hash;
        server lab:7860; 
	}

	server {

		listen 80 default_server;
        absolute_redirect off;
		listen [::]:80 default_server;

		location = / { return 302 /lab/course-home$is_args$args; }

		location = /lab { return 302 /lab/course-home$is_args$args; }
        location = /lab/ { return 302 /lab/course-home$is_args$args; }


        location = /__lab_auth {
            internal;
            proxy_pass http://lab:8888/lab/api/status;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_intercept_errors on;
            error_page 404 405 500 502 503 504 =403 @lab_auth_denied;
        }
        location @lab_auth_denied { return 403; }

        location = /lab/dozzle { return 302 /lab/dozzle/; }
        location ^~ /lab/dozzle/ {
            auth_request /__lab_auth;
            proxy_pass http://dozzle:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /lab {
			proxy_pass http://lab:8888;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_buffering off;
		}

		# https://www.gradio.app/guides/running-gradio-on-your-web-server-with-nginx
		location /8090/ {
			proxy_pass http://gradio-app/;
			proxy_http_version 1.1;
			proxy_buffering off;
			proxy_redirect off;
			proxy_read_timeout 3600;
			proxy_send_timeout 3600;

			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "";

			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
		}

		# # https://www.gradio.app/guides/running-gradio-on-your-web-server-with-nginx
		# location /8999/ {
		# 	proxy_pass http://gradio-chat/;
		# 	proxy_http_version 1.1;
		# 	proxy_buffering off;
		# 	proxy_redirect off;
		# 	proxy_set_header Host $http_host;  # Use $http_host to pass the original Host header
		# 	proxy_set_header X-Real-IP $remote_addr;  # Pass the original client IP
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Append the client IP to X-Forwarded-For
		# 	proxy_set_header X-Forwarded-Host $host;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# 	proxy_set_header Connection "";  # For HTTP/1.1 compatibility
		# 	proxy_set_header Upgrade $http_upgrade;  # For WebSocket support
		# }

		location /7860/ {
			proxy_pass http://gradio-pass/;
			proxy_http_version 1.1;
			proxy_buffering off;
			proxy_redirect off;
			proxy_set_header Host $http_host;  # Use $http_host to pass the original Host header
			proxy_set_header X-Real-IP $remote_addr;  # Pass the original client IP
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Append the client IP to X-Forwarded-For
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection $connection_upgrade;
			proxy_set_header Upgrade $http_upgrade;  # For WebSocket support
		}

        location /jaeger {
            auth_request /__lab_auth;
            proxy_pass http://jaeger:16686; 

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
	}
}
